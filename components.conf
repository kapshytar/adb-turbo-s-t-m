# Компоненты ADB Turbo S/T — сторонний GPLv3-код, который НЕ лежит в этом репо.
# Этот репо под MIT; втащить сюда GPLv3-исходники = сделать GPLv3 всё. Поэтому здесь
# только УКАЗАТЕЛЬ: откуда взять компонент и на каком коммите он считается «нашим».
#
# Формат:  name|kind|path|upstream|fork|branch|pin
#   kind=fork   — есть наш форк. ПРАВКИ ЖИВУТ КОММИТАМИ В ФОРКЕ, сюда попадает только pin.
#   kind=patch  — своего форка нет. Правки живут файлами в patch/ поверх upstream.
#   path        — относительно корня рабочей папки (по умолчанию ~/PhoneAsExtStorage)
#   pin         — коммит форка, на котором собран текущий релиз ('-' для kind=patch)
#
# Обновить pin после правки компонента:  scripts/components.sh pin
# Поставить всё с нуля:                  scripts/components.sh sync
# Посмотреть расхождения:                scripts/components.sh status

